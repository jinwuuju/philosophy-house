<!doctype html>
<html lang='ko'>
  <head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover' />
    <meta name='theme-color' content='#1b1424' />
    <title>진우주 철학관</title>
    <link rel='icon' href='data:,' />
    <script type="module" crossorigin src="./assets/index-qClOti0B.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dir5KBRx.css">
  </head>
  <body>
    <canvas id='screen' aria-hidden='true'></canvas>
    <main id='title-screen' class='overlay'>
      <h1>진우주 철학관</h1>
      <p class='subtitle'>서양편</p>
      <div class='title-menu'>
        <button id='continue-game' class='primary' type='button' hidden></button>
        <button id='new-game' class='primary' type='button'>새로 시작</button>
        <button id='fortune-open' class='secondary' type='button'>오늘의 운세</button>
      </div>
      <p class='hint'>검은 고양이 진우주가 기다리는 중</p>
      <p class='version' id='version'></p>
    </main>
    <div id='hud' class='hud' hidden></div>
    <div id='goal' class='goal' hidden></div>
    <button id='act' class='act' type='button' hidden></button>
    <button id='wait' class='wait' type='button' hidden></button>
    <button id='menu-open' class='menu-open' type='button' hidden></button>
    <button id='bag-open' class='bag-open' type='button' hidden></button>
    <button id='minimap' class='minimap' type='button' hidden></button>
    <div id='bigmap' class='bigmap' hidden></div>
    <div id='menu' class='menu' hidden></div>
    <div id='consult' class='consult' hidden></div>
    <div id='sort' class='consult sort' hidden></div>
    <div id='board' class='board' hidden></div>
    <div id='drawer' class='drawer' hidden></div>
    <div id='codex' class='codex' hidden></div>
    <div id='help' class='help' hidden></div>
    <div id='fortune' class='fortune' hidden></div>
    <div id='cave' class='cave' hidden></div>
    <div id='arcade' class='arcade' hidden></div>
    <div id='shop' class='market' hidden></div>
    <div id='bag' class='market' hidden></div>
    <div id='summary' class='summary' hidden></div>
    <div id='alley-board' class='alley' hidden></div>
    <div id='ask' class='ask' role='dialog' aria-labelledby='ask-text' hidden><p id='ask-text'></p><div class='ask-buttons'><button id='ask-yes' class='primary' type='button'></button><button id='ask-no' class='secondary' type='button'></button></div></div>
    <div id='fade' class='fade' hidden><p id='day-caption' class='day-caption'></p></div>
    <p id='place-caption' class='place-caption' aria-live='polite'></p>
    <div id='toast' class='toast' hidden></div>
    <div id='dialog-scrim' class='dialog-scrim' hidden></div>
    <div id='stick' class='stick' hidden><div id='stick-knob' class='stick-knob'></div></div>
  </body>
</html>
